<!DOCTYPE html>

<html lang="lv">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        Reģistrācija | Student Chat
    </title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body>


<nav
    class="navbar navbar-dark bg-dark"
>

    <div class="container">

        <a
            class="navbar-brand"
            href="/"
        >
            Student Chat
        </a>


        <a
            href="/"
            class="btn btn-outline-light btn-sm"
        >
            Pieslēgties
        </a>

    </div>

</nav>


<div
    class="container my-5"
>

    <div
        class="row justify-content-center"
    >

        <div
            class="col-md-7 col-lg-5"
        >

            <div
                class="card shadow"
            >

                <div
                    class="card-body p-4"
                >

                    <h2
                        class="mb-2"
                    >
                        Reģistrācija
                    </h2>


                    <p
                        class="text-secondary mb-4"
                    >
                        Izveido Student Chat kontu.
                    </p>


                    <form
                        id="registerForm"
                    >


                        <div
                            class="mb-3"
                        >

                            <label
                                for="usernameInput"
                                class="form-label"
                            >
                                Lietotājvārds
                            </label>


                            <input
                                type="text"
                                id="usernameInput"
                                class="form-control"
                                minlength="3"
                                maxlength="30"
                                autocomplete="username"
                                required
                            >

                        </div>


                        <div
                            class="mb-3"
                        >

                            <label
                                for="courseSelect"
                                class="form-label"
                            >
                                Kurss
                            </label>


                            <select
                                id="courseSelect"
                                class="form-select"
                                required
                            >

                                <option
                                    value=""
                                    selected
                                    disabled
                                >
                                    Izvēlies kursu...
                                </option>

                            </select>

                        </div>


                        <div
                            class="mb-3"
                        >

                            <label
                                for="passwordInput"
                                class="form-label"
                            >
                                Parole
                            </label>


                            <input
                                type="password"
                                id="passwordInput"
                                class="form-control"
                                minlength="8"
                                maxlength="72"
                                autocomplete="new-password"
                                required
                            >


                            <div
                                class="form-text"
                            >
                                Vismaz 8 rakstzīmes.
                            </div>

                        </div>


                        <div
                            class="mb-4"
                        >

                            <label
                                for="passwordConfirmInput"
                                class="form-label"
                            >
                                Atkārto paroli
                            </label>


                            <input
                                type="password"
                                id="passwordConfirmInput"
                                class="form-control"
                                minlength="8"
                                maxlength="72"
                                autocomplete="new-password"
                                required
                            >

                        </div>


                        <div
                            id="errorMessage"
                            class="alert alert-danger d-none"
                        >
                        </div>


                        <button
                            id="registerButton"
                            type="submit"
                            class="btn btn-success w-100"
                        >
                            Reģistrēties
                        </button>

                    </form>


                    <div
                        class="text-center mt-3"
                    >

                        <a
                            href="/"
                            class="text-decoration-none"
                        >
                            Jau ir konts? Pieslēgties
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
>
</script>


<script
    src="js/register.js"
>
</script>


</body>

</html>
