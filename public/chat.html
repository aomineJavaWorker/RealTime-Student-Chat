<!DOCTYPE html>

<html lang="lv">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        Čats | Student Chat
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body>


<nav class="navbar navbar-dark bg-dark">

    <div class="container d-flex gap-2">

        <a
            class="navbar-brand"
            href="/chat.html"
        >
            Student Chat
        </a>


        <div
            class="d-flex align-items-center gap-2 ms-auto"
        >

            <span
                id="usernameDisplay"
                class="badge text-bg-primary"
            >
            </span>


            <button
                id="logoutButton"
                type="button"
                class="btn btn-outline-light btn-sm"
            >
                Iziet
            </button>

        </div>

    </div>

</nav>


<div class="container my-4">


    <!-- LOADING -->

    <div
        id="loadingMessage"
        class="alert alert-light border"
    >
        Ielādē čatu...
    </div>


    <!-- CHAT -->

    <div
        id="chatSection"
        class="d-none"
    >

        <div class="row g-4">


            <!-- CHAT -->

            <div class="col-lg-9">

                <div class="card shadow">

                    <div class="card-body">


                        <!-- HEADER -->

                        <div
                            class="d-flex justify-content-between align-items-center gap-3 mb-3"
                        >

                            <div>

                                <h2
                                    id="chatTitle"
                                    class="mb-0"
                                >
                                    Čats
                                </h2>


                                <small
                                    id="courseName"
                                    class="text-secondary"
                                >
                                </small>

                            </div>

                        </div>


                        <!-- SEARCH -->

                        <div
                            class="input-group mb-3"
                        >

                            <input
                                type="text"
                                id="searchInput"
                                class="form-control"
                                placeholder="Meklēt ziņas vai lietotāju..."
                            >


                            <button
                                id="clearSearchButton"
                                type="button"
                                class="btn btn-outline-secondary"
                            >
                                Notīrīt
                            </button>

                        </div>


                        <div
                            id="searchEmpty"
                            class="alert alert-light border d-none"
                        >
                            Nekas netika atrasts.
                        </div>


                        <!-- MESSAGES -->

                        <div
                            id="messages"
                            class="border rounded p-3 mb-2"
                            style="max-height: 60vh; overflow-y: auto;"
                        >

                            <p
                                id="emptyMessages"
                                class="text-secondary mb-0"
                            >
                                Ziņu vēl nav.
                            </p>

                        </div>


                        <!-- UNREAD MESSAGES -->

                        <div
                            id="unreadIndicator"
                            class="alert alert-primary py-2 mb-2 d-none"
                            role="button"
                            tabindex="0"
                        >

                            <div
                                class="d-flex justify-content-between align-items-center"
                            >

                                <span>

                                    Nelasītas ziņas:

                                    <strong
                                        id="unreadCount"
                                    >
                                        0
                                    </strong>

                                </span>


                                <span>
                                    ↓
                                </span>

                            </div>

                        </div>


                        <!-- TYPING INDICATOR -->

                        <div
                            id="typingIndicator"
                            class="text-secondary small mb-2 d-none"
                        >
                        </div>


                        <!-- REPLY PREVIEW -->

                        <div
                            id="replyPreview"
                            class="alert alert-secondary d-none py-2"
                        >

                            <div
                                class="d-flex justify-content-between align-items-start gap-3"
                            >

                                <div class="overflow-hidden">

                                    <small
                                        class="text-secondary"
                                    >
                                        Atbilde uz
                                    </small>


                                    <div>

                                        <strong
                                            id="replyUsername"
                                        >
                                        </strong>

                                    </div>


                                    <div
                                        id="replyText"
                                        class="text-truncate"
                                    >
                                    </div>

                                </div>


                                <button
                                    id="cancelReplyButton"
                                    type="button"
                                    class="btn-close"
                                    aria-label="Atcelt"
                                >
                                </button>

                            </div>

                        </div>


                        <!-- SEND MESSAGE -->

                        <div class="input-group">

                            <input
                                type="text"
                                id="messageInput"
                                class="form-control"
                                maxlength="2000"
                                placeholder="Raksti ziņu..."
                            >


                            <button
                                id="sendButton"
                                type="button"
                                class="btn btn-primary"
                            >
                                Nosūtīt
                            </button>

                        </div>


                        <div
                            id="messageError"
                            class="alert alert-danger d-none mt-3 mb-0"
                        >
                        </div>

                    </div>

                </div>

            </div>


            <!-- ONLINE USERS -->

            <div class="col-lg-3">

                <div class="card shadow">

                    <div class="card-header">

                        <div
                            class="d-flex justify-content-between align-items-center"
                        >

                            <strong>
                                Tiešsaistē
                            </strong>


                            <span
                                id="onlineUsersCount"
                                class="badge text-bg-success"
                            >
                                0
                            </span>

                        </div>

                    </div>


                    <div
                        id="onlineUsers"
                        class="list-group list-group-flush"
                    >

                        <div
                            class="list-group-item text-secondary"
                        >
                            Neviens nav tiešsaistē.
                        </div>

                    </div>

                </div>

            </div>


        </div>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
>
</script>


<script
    src="/socket.io/socket.io.js"
>
</script>


<script
    src="js/chat.js"
>
</script>


</body>

</html>
