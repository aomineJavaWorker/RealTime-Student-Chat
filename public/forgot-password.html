<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2563eb">
    <title>Paroles atjaunošana | Student Chat</title>
    <script src="js/theme.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/theme.css" rel="stylesheet">
    <link href="css/auth.css" rel="stylesheet">
</head>
<body class="auth-page">
    <a class="auth-skip-link" href="#resetForm">Pāriet uz formu</a>
    <header>
        <nav class="navbar auth-navbar" aria-label="Galvenā navigācija">
            <div class="container auth-container">
                <a class="navbar-brand auth-brand" href="/">
                    <span class="auth-brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H4l1.8-3.6A7.5 7.5 0 1 1 20 11.5Z"/><path d="M8 10h8M8 13.5h5"/></svg></span>
                    Student Chat
                </a>
                <div class="auth-navbar-actions">
                    <button type="button" class="theme-toggle" data-theme-toggle aria-label="Ieslēgt tumšo tēmu" hidden>
                        <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/></svg>
                        <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 13.3A8.5 8.5 0 0 1 10.7 3.5a8.5 8.5 0 1 0 9.8 9.8Z"/></svg>
                    </button>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-5">
        <section class="card auth-card verification-card mx-auto" aria-labelledby="authTitle">
            <div class="card-body">
                <h1 id="authTitle">Atjauno paroli</h1>
                <form id="resetForm" novalidate>
                    <div id="emailStep" class="auth-field">
                        <label for="resetEmail" class="form-label">Apstiprinātā e-pasta adrese</label>
                        <input id="resetEmail" type="email" class="form-control" autocomplete="email" maxlength="254" placeholder="Ievadi e-pasta adresi" required>
                    </div>
                    <div id="codeStep" class="auth-field" hidden>
                        <label for="resetCode" class="form-label">Sešciparu kods</label>
                        <input id="resetCode" type="text" class="form-control" inputmode="numeric" autocomplete="one-time-code" maxlength="6" aria-describedby="codeHint">
                        <div id="codeHint" class="form-text">Meklē kodu e-pastā. Tas ir derīgs 10 minūtes.</div>
                    </div>
                    <div id="passwordStep" hidden>
                        <div class="auth-field">
                            <label for="newPassword" class="form-label">Jaunā parole</label>
                            <input id="newPassword" type="password" class="form-control" autocomplete="new-password" maxlength="72" aria-describedby="passwordHint">
                            <div id="passwordHint" class="form-text">Vismaz 8 rakstzīmes. Maksimālais garums ir 72 baiti.</div>
                        </div>
                        <div class="auth-field">
                            <label for="repeatPassword" class="form-label">Atkārto jauno paroli</label>
                            <input id="repeatPassword" type="password" class="form-control" autocomplete="new-password" maxlength="72">
                        </div>
                    </div>
                    <p id="feedback" role="status" aria-live="polite"></p>
                    <button id="submitReset" class="btn btn-primary w-100 auth-submit">Nosūtīt kodu</button>
                </form>
                <button id="resend" type="button" class="btn btn-outline-secondary w-100 mt-2" hidden>Nosūtīt jaunu kodu</button>
                <button id="restart" type="button" class="btn btn-link w-100 mt-2" hidden>Sākt no jauna</button>
                <p class="auth-switch"><a href="/">Atgriezties pie pieslēgšanās</a></p>
                <p class="auth-switch small"><a href="/privacy.html">Privātuma politika</a></p>
            </div>
        </section>
    </main>

    <script src="js/forgot-password.js"></script>
</body>
</html>
