<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2563eb">
    <title>E-pasta apstiprināšana | Student Chat</title>
    <script src="js/theme.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/theme.css" rel="stylesheet">
    <link href="css/auth.css" rel="stylesheet">
    <link href="css/footer.css" rel="stylesheet">
</head>
<body class="auth-page">
    <a class="auth-skip-link" href="#codeForm">Pāriet uz formu</a>
    <header>
        <nav class="navbar auth-navbar" aria-label="Galvenā navigācija">
            <div class="container auth-container">
                <a class="navbar-brand auth-brand" href="/chat.html">
                    <span class="auth-brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H4l1.8-3.6A7.5 7.5 0 1 1 20 11.5Z"/><path d="M8 10h8M8 13.5h5"/></svg></span>
                    Student Chat
                </a>
                <div class="auth-navbar-actions">
                    <button type="button" class="theme-toggle" data-theme-toggle aria-label="Ieslēgt tumšo tēmu" hidden>
                        <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/></svg>
                        <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 13.3A8.5 8.5 0 0 1 10.7 3.5a8.5 8.5 0 1 0 9.8 9.8Z"/></svg>
                    </button>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-5">
        <section class="card auth-card verification-card mx-auto" aria-labelledby="authTitle">
            <div class="card-body">
                <h1 id="authTitle">Apstiprini e-pasta adresi</h1>
                <p class="auth-form-description text-break">Lai apstiprinātu adresi <strong id="verificationAddress"></strong>, ievadi sešciparu kodu no Student Chat vēstules. Kods ir derīgs 10 minūtes.</p>
                <form id="codeForm" novalidate>
                    <div class="auth-field">
                        <label for="code" class="form-label">Apstiprinājuma kods</label>
                        <input id="code" class="form-control" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required>
                    </div>
                    <p id="feedback" role="status" aria-live="polite"></p>
                    <button id="confirm" class="btn btn-primary w-100 auth-submit" disabled>Apstiprināt</button>
                </form>
                <button id="resend" type="button" class="btn btn-outline-secondary w-100 mt-2" disabled>Nosūtīt jaunu kodu</button>
                <p class="auth-switch"><a href="/chat.html">Turpināt uz čatu</a></p>
            </div>
        </section>
    </main>

<footer class="site-footer">
    <div class="site-footer-inner">
        <div class="site-footer-project">
            <strong><svg class="site-icon" aria-hidden="true"><use href="/icons.svg#chat"/></svg> Student Chat</strong>
            <span>Bezmaksas mācību projekts studentu saziņai.</span>
        </div>
        <nav aria-label="Kājenes saites">
            <a href="/privacy.html"><svg class="site-icon" aria-hidden="true"><use href="/icons.svg#shield"/></svg> Privātuma politika</a>
            <a href="mailto:aleksandrs.denisenko.it@gmail.com"><svg class="site-icon" aria-hidden="true"><use href="/icons.svg#mail"/></svg> Kontaktinformācija</a>
        </nav>
        <small>© 2026 Student Chat</small>
    </div>
</footer>

    <script src="js/verify-email.js"></script>
</body>
</html>
