<!DOCTYPE html>

<html lang="lv">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        Pieslēgties | Student Chat
    </title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body>


<nav
    class="navbar navbar-dark bg-dark"
>

    <div class="container">

        <span
            class="navbar-brand"
        >
            Student Chat
        </span>


        <a
            href="register.html"
            class="btn btn-outline-light btn-sm"
        >
            Reģistrēties
        </a>

    </div>

</nav>


<div
    class="container my-5"
>

    <div
        class="row justify-content-center"
    >

        <div
            class="col-md-7 col-lg-5"
        >

            <div
                class="card shadow"
            >

                <div
                    class="card-body p-4"
                >

                    <h2
                        class="mb-2"
                    >
                        Pieslēgties
                    </h2>


                    <p
                        class="text-secondary mb-4"
                    >
                        Ievadi sava Student Chat konta datus.
                    </p>


                    <form
                        id="loginForm"
                    >


                        <div
                            class="mb-3"
                        >

                            <label
                                for="usernameInput"
                                class="form-label"
                            >
                                Lietotājvārds
                            </label>


                            <input
                                type="text"
                                id="usernameInput"
                                class="form-control"
                                minlength="3"
                                maxlength="30"
                                autocomplete="username"
                                required
                            >

                        </div>


                        <div
                            class="mb-3"
                        >

                            <label
                                for="courseSelect"
                                class="form-label"
                            >
                                Kurss
                            </label>


                            <select
                                id="courseSelect"
                                class="form-select"
                                required
                            >

                                <option
                                    value=""
                                    selected
                                    disabled
                                >
                                    Izvēlies kursu...
                                </option>

                            </select>

                        </div>


                        <div
                            class="mb-4"
                        >

                            <label
                                for="passwordInput"
                                class="form-label"
                            >
                                Parole
                            </label>


                            <input
                                type="password"
                                id="passwordInput"
                                class="form-control"
                                autocomplete="current-password"
                                required
                            >

                        </div>


                        <div
                            id="errorMessage"
                            class="alert alert-danger d-none"
                        >
                        </div>


                        <button
                            id="loginButton"
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            Pieslēgties
                        </button>

                    </form>


                    <hr
                        class="my-4"
                    >


                    <div
                        class="text-center"
                    >

                        <p
                            class="text-secondary mb-2"
                        >
                            Vēl nav konta?
                        </p>


                        <a
                            href="register.html"
                            class="btn btn-outline-primary"
                        >
                            Reģistrēties
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
>
</script>


<script
    src="js/app.js"
>
</script>


</body>

</html>
